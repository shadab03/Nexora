version: 3
sources:
  - name: customer_db
    kind: postgres
    configuration:
      connection_info:
        database_url:
          from_env: HASURA_GRAPHQL_DATABASE_URL
        isolation_level: read-committed
        use_prepared_statements: false
    tables:
      - table:
          schema: public
          name: customers
        array_relationships:
          - name: addresses
            using:
              foreign_key_constraint_on:
                table:
                  schema: public
                  name: customer_addresses
                column: customer_id
        select_permissions: []
        insert_permissions: []
        update_permissions: []
        delete_permissions: []
      - table:
          schema: public
          name: customer_addresses
        object_relationships:
          - name: customer
            using:
              foreign_key_constraint_on: customer_id
        select_permissions: []
        insert_permissions: []
        update_permissions: []
        delete_permissions: []
